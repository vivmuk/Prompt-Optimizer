[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route the app's /api/* calls to the proxy function, so the deployed site
# behaves like the local Node server. Without these the requests fell through
# to the static 404 page and every generator failed.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/venice/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/venice/models"
  status = 200
  force = true

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/venice/image"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/venice/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.venice.ai; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;"
